<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>You're invited to Loop</title>
<style>
  :root { --page: #F2F2F7; --panel: #FFFFFF; --raised: #E5E5EA; --text: #000000; --text2: #6E6E73; --accent: #3E63DD; --on-accent: #FFFFFF; }
  @media (prefers-color-scheme: dark) {
    :root { --page: #000000; --panel: #1C1C1E; --raised: #2C2C2E; --text: #FFFFFF; --text2: #A1A1A6; --accent: #7B8CFF; --on-accent: #0B0F2A; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: 56px 24px 40px; display: flex; flex-direction: column; gap: 20px; }
  .mark { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
  h1 { font-size: 30px; line-height: 1.12; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
  p { margin: 0; color: var(--text2); }
  .button { display: block; text-align: center; text-decoration: none; background: var(--accent); color: var(--on-accent); font-weight: 600; padding: 15px 20px; border-radius: 999px; }
  .code { background: var(--panel); border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
  .code span { font-size: 13px; color: var(--text2); }
  .code strong { font: 600 18px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.06em; overflow-wrap: anywhere; user-select: all; }
  .code button { align-self: flex-start; margin-top: 6px; font: inherit; font-size: 15px; font-weight: 600; color: var(--text); background: var(--raised); border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
      <path d="M22.5 9.2A9.6 9.6 0 1 0 24.6 15" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="23.4" cy="9.8" r="2.4" fill="#FFFFFF"/>
    </svg>
  </div>
  <h1 id="title">You're invited to a circle on Loop</h1>
  <p id="lede">Loop is a private app for a group of friends: chat, plans, streaks and shared money.</p>
  <a id="open" class="button" href="#">Open in Loop</a>
  <div id="box" class="code">
    <span>Invite code</span>
    <strong id="code"></strong>
    <button id="copy" type="button">Copy</button>
  </div>
  <p id="help">Don't have Loop yet? Ask the friend who sent this link for the app, then tap the link again.</p>
</main>
<script>
  (function () {
    var code = new URLSearchParams(location.search).get('c') || '';
    var byId = function (id) { return document.getElementById(id); };
    // Only what an invite code can be: 8 to 32 letters and digits. Nothing else reaches the page.
    if (!/^[a-zA-Z0-9]{8,32}$/.test(code)) {
      byId('title').textContent = 'This invite link is incomplete';
      byId('lede').textContent = 'Ask your friend to send it again.';
      byId('open').hidden = true;
      byId('box').hidden = true;
      byId('help').hidden = true;
      return;
    }
    byId('open').href = 'streaks://invite/' + code;
    byId('code').textContent = code;
    byId('copy').addEventListener('click', function () {
      var button = byId('copy');
      var done = function () { button.textContent = 'Copied'; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(done, function () { window.getSelection().selectAllChildren(byId('code')); });
      } else {
        window.getSelection().selectAllChildren(byId('code'));
      }
    });
  })();
</script>
</body>
</html>
